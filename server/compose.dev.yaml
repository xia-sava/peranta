# 開発用ローカル ntfy（本番と同じ server.yml を使う）。
# 本番と違い TLS プロキシを挟まず、ポートを直接 publish する。
#
# 起動:      docker compose -f compose.dev.yaml up -d
# ユーザー:   docker compose -f compose.dev.yaml exec -e NTFY_PASSWORD=<pw> ntfy ntfy user add peranta
# ACL:       docker compose -f compose.dev.yaml exec ntfy ntfy access peranta "peranta-*" rw
#            docker compose -f compose.dev.yaml exec ntfy ntfy access peranta "up*" rw
#            （up* は UnifiedPush 用。ntfy アプリが払い出す upXXXX トピックの購読/配送に必要）
# トークン:   docker compose -f compose.dev.yaml exec ntfy ntfy token add peranta
# 発行したトークン等は server/.local/ に保存する（gitignore 済み）

name: peranta-dev

services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    ports:
      - "8090:80"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ./.local/data:/var/lib/ntfy
      # cache.db と添付（attachment-cache-dir=/var/cache/ntfy/attachments、§4.3）の両方がこの下に入る
      - ./.local/cache:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: "http://localhost:8090"
    restart: unless-stopped
