# 本番の ntfy。前段の TLS リバースプロキシとは external network `proxy` で繋ぐため、
# ポートは publish しない。立ち上げ手順は README.md を参照。
#
# 起動:      docker compose up -d
# ユーザー:   docker compose exec -e NTFY_PASSWORD=<pw> ntfy ntfy user add peranta
# ACL:       docker compose exec ntfy ntfy access peranta "peranta-*" rw
#            docker compose exec ntfy ntfy access peranta "up*" rw
#            （up* は UnifiedPush 用。ntfy アプリが払い出す upXXXX トピックの購読/配送に必要）
# トークン:   docker compose exec ntfy ntfy token add peranta
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: peranta-ntfy
    command: serve
    environment:
      NTFY_BASE_URL: "https://${PERANTA_DOMAIN:?.env に PERANTA_DOMAIN を設定してください（.env.example 参照）}"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      # user.db（ユーザー・ACL・トークン）。唯一のバックアップ対象
      - ./data:/var/lib/ntfy
      # cache.db と添付。中身はいずれも保持期間で自動的に消える
      - ./cache:/var/cache/ntfy
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
