# ntfy サーバ設定（開発・本番共通）
# 環境依存の値は環境変数 NTFY_* で渡す。base-url はここには書かず、compose 側から必ず与える。
# - 開発: compose.dev.yaml が NTFY_BASE_URL=http://localhost:8090 を設定
# - 本番: compose.yaml が .env の PERANTA_DOMAIN から NTFY_BASE_URL を組み立てる

# 前段のリバースプロキシからはコンテナ内の 80 番へ渡る（外へは publish しない）
listen-http: ":80"

# 認証: 認証なしのアクセスは一切許可しない（トークン必須）。
# ACL に匿名（`*`）の書き込みを足すとこの前提が崩れ、ドメイン名を知るだけの第三者が
# 添付枠とメッセージキャッシュを埋められる。ACL の与え方は README.md「6. ユーザーとトークンを作る」。
auth-file: "/var/lib/ntfy/user.db"
auth-default-access: "deny-all"

# メッセージキャッシュ
# 配送 topic の保持は publish 時の Cache ヘッダで個別に短縮する。
# control topic（ロスター）はこのグローバル保持期間に依存する。
cache-file: "/var/cache/ntfy/cache.db"
cache-duration: "24h"

# 添付（暗号化 blob）の置き場（§4.3）。誰も購読しない blobTopic へ PUT された暗号文を保持する。
# 本体は常にクライアント側で暗号化済み。
#
# 3 つの上限は値そのものではなく関係に意味がある。
#   1 添付の上限 ≤ visitor 合計の上限 ≤ 全体の上限の 1/4
# visitor 合計を全体と同値にすると、単一の主体が全体枠を占有して他の端末のアップロードを
# 保持期間いっぱい止められる。全体を変えるときは他の 2 つも関係を保ったまま動かす。
attachment-cache-dir: "/var/cache/ntfy/attachments"
# 1 添付あたりの上限（§4.3 の 300MB に安全マージンを乗せる）
attachment-file-size-limit: "350M"
# 全添付の合計ディスク上限。超えると新規アップロードを拒む（保持期間切れで空く）
attachment-total-size-limit: "2G"
# 添付の保持期間（受信は手動ダウンロード想定のため長め）
attachment-expiry-duration: "72h"
# 1 visitor あたりの添付合計・日次帯域の上限
visitor-attachment-total-size-limit: "512M"
visitor-attachment-daily-bandwidth-limit: "3G"

# AttachmentRef を載せた通知本文の余裕を持たせるため既定（4k）から引き上げる（§4.3）
message-size-limit: "16k"

# 前段に TLS 終端のリバースプロキシを置く
behind-proxy: true

# 通知本文をログに出さないため info 以下で運用する
log-level: "info"
