# 開発用ローカル ntfy（本番と同じ server.yml を使う）
# 起動:      docker compose up -d
# ユーザー:   docker compose exec -e NTFY_PASSWORD=<pw> ntfy ntfy user add peranta
# ACL:       docker compose exec ntfy ntfy access peranta "peranta-*" rw
#            docker compose exec ntfy ntfy access peranta "up*" rw
#            （up* は UnifiedPush 用。ntfy アプリが払い出す upXXXX トピックの購読/配送に必要）
# トークン:   docker compose exec ntfy ntfy token add peranta
# 発行したトークン等は server/.local/ に保存する（gitignore 済み）
services:
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    command: serve
    ports:
      - "8090:80"
    volumes:
      - ./server.yml:/etc/ntfy/server.yml:ro
      - ./.local/data:/var/lib/ntfy
      # cache.db と添付（attachment-cache-dir=/var/cache/ntfy/attachments、§4.3）の両方がこの下に入る
      - ./.local/cache:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: "http://localhost:8090"
    restart: unless-stopped

  # 自己更新（M5）の検証用の静的配信。ntfy(8090) とはポートを分ける。
  # 本番では peranta.sava.to の前段 TLS プロキシが同じ /dist/ を配信する（§12）。
  # server/dist/ を /dist にマウントするので http://localhost:8091/dist/latest.json で引ける。
  # UpdateChecker のホスト設定を localhost:8091(http) にすると Available を確認できる。
  dist:
    image: nginx:alpine
    ports:
      - "8091:80"
    volumes:
      - ./dist:/usr/share/nginx/html/dist:ro
    restart: unless-stopped
