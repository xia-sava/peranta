name: Release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# 既定では GITHUB_TOKEN に何の権限も与えない。必要なジョブが必要な分だけ宣言する。
permissions: {}

# 連続 push で古いビルドが後勝ちしないよう、同時実行を1本に絞る。
concurrency:
  group: release
  cancel-in-progress: true

env:
  JAVA_VERSION: "23"
  # jpackage が使えるのは WiX 3 系のみ。ランナーに無いときに入れる版を固定する。
  WIX_VERSION: "3.14.1"

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.compute.outputs.code }}
      name: ${{ steps.compute.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # versionCode は単調増加する run number、versionName は gradle.properties の
      # major.minor に run number を patch として付ける（版を上げる時はそちらを書き換える）。
      - name: Compute version
        id: compute
        run: |
          set -euo pipefail
          major_minor=$(sed -n 's/^peranta\.versionName=\([0-9]\+\.[0-9]\+\).*/\1/p' gradle.properties)
          if [ -z "$major_minor" ]; then
            echo "peranta.versionName を gradle.properties から読めません" >&2
            exit 1
          fi
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=${major_minor}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  # 配布物を作る前にテストとカバレッジ検証を通す。ここが落ちればリリースまで進まない。
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # リポジトリに置いている gradle-wrapper.jar が公式のものであることを確かめる。
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # check は androidMain のコンパイルを含まないため、対象を明示して補う。
      - name: Run tests
        run: >
          ./gradlew check :shared:compileAndroidMain :androidApp:compileDebugKotlin
          --console=plain

  desktop:
    needs: [version, check]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # jpackage の MSI 生成は WiX 3 の candle/light を PATH から探す（WiX 4 以降は使えない）。
      # ランナーに入っている版を使い、無いときだけ WIX_VERSION の版を入れる。
      - name: Ensure WiX 3 on PATH
        run: |
          $programFiles = ${env:ProgramFiles(x86)}
          $findWix = { Get-ChildItem $programFiles -Directory -Filter "WiX Toolset v3.*" -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -Last 1 }
          $wix = & $findWix
          if (-not $wix) {
            choco install wixtoolset "--version=$env:WIX_VERSION" --require-checksums --no-progress -y
            $wix = & $findWix
          }
          if (-not $wix) { throw "WiX 3 が見つかりません" }
          Write-Host "WiX toolset: $($wix.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName "bin")

      - name: Build MSI
        run: >
          ./gradlew :desktopApp:packageMsi
          "-Pperanta.versionCode=${{ needs.version.outputs.code }}"
          "-Pperanta.versionName=${{ needs.version.outputs.name }}"
          --console=plain

      - name: Collect MSI
        run: |
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI が生成されていません" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $msi.FullName artifacts/peranta.msi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: artifacts/peranta.msi
          if-no-files-found: error

  android:
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # 署名鍵は secrets から復元する。同じ鍵で署名し続ける限り端末上で上書き更新できる。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 が未設定です" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          PERANTA_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          PERANTA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PERANTA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PERANTA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :androidApp:assembleRelease
          "-Pperanta.versionCode=${{ needs.version.outputs.code }}"
          "-Pperanta.versionName=${{ needs.version.outputs.name }}"
          --console=plain

      # 署名鍵が効かないと APK は -unsigned の名前で出る。未署名のまま配ると端末で
      # 上書き更新できないので、署名済みだけを拾って見つからなければ落とす。
      - name: Collect APK
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "署名済みの APK が生成されていません" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$apk" artifacts/peranta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/peranta.apk
          if-no-files-found: error

  # 配布物の照合値からマニフェストを組む。公開の権限は持たず、成果物として release へ渡す。
  manifest:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # アプリが引く latest.json。url は配布済みの旧版が取得先として読むため載せ続ける。
      - name: Write latest.json
        env:
          VERSION_CODE: ${{ needs.version.outputs.code }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPOSITORY}/releases/download/latest"
          apk_sha=$(sha256sum artifacts/peranta.apk | cut -d' ' -f1)
          msi_sha=$(sha256sum artifacts/peranta.msi | cut -d' ' -f1)
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$base/peranta.apk" --arg apkSha "$apk_sha" \
            --arg msiUrl "$base/peranta.msi" --arg msiSha "$msi_sha" \
            '{
              android: { versionCode: $versionCode, versionName: $versionName, url: $apkUrl, sha256: $apkSha },
              desktop: { versionCode: $versionCode, versionName: $versionName, url: $msiUrl, sha256: $msiSha }
            }' > artifacts/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: artifacts/latest.json
          if-no-files-found: error

  # 成果物を公開するだけのジョブ。contents: write を持つのはここだけ。
  release:
    needs: [desktop, android, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            master への push のたびに更新される最新ビルド。
            アプリの設定画面「アプリの更新」から確認・適用できる。
          prerelease: true
          files: |
            artifacts/peranta.msi
            artifacts/peranta.apk
            artifacts/latest.json
