name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# 既定では GITHUB_TOKEN に何の権限も与えない。必要なジョブが必要な分だけ宣言する。
permissions: {}

# 連続して打ったタグを取りこぼさないよう、キャンセルせず順に流す。
concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: "23"
  # jpackage が使えるのは WiX 3 系のみ。ランナーに無いときに入れる版を固定する。
  WIX_VERSION: "3.14.1"
  # マニフェストの署名を確かめる公開鍵（X.509 SubjectPublicKeyInfo の DER を base64）。
  # アプリへ埋め込んである値と同じでなければならない。
  MANIFEST_PUBLIC_KEY: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEEZEKvNteC6DDKA7tYX85vzGFlhjQbhwc/99nC6q8ED3YphUC9mvbZYWVgCUb+sizUFzZMQQdAiLN1d11Nmnbhw=="

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.compute.outputs.code }}
      name: ${{ steps.compute.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # versionCode をコミット数で決めるため全履歴を取る（既定の浅い取得では 1 になる）。
          fetch-depth: 0

      # versionCode はコミット数（単調増加し、タグの打ち方に左右されない）、
      # versionName はタグ名から v を除いたもの。配布しない手動実行は識別できる名前を付ける。
      - name: Compute version
        id: compute
        run: |
          set -euo pipefail
          code=$(git rev-list --count HEAD)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            # MSI の版数は major.minor.patch しか受け付けないため、接尾辞つきのタグも弾く。
            if ! printf '%s' "$name" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "タグは vMAJOR.MINOR.PATCH の形で打つこと（受け取った値: $GITHUB_REF_NAME）" >&2
              exit 1
            fi
          else
            name="dev-$(git rev-parse --short HEAD)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "versionCode=$code versionName=$name"

      # 配布中の版より versionCode が増えていることを確かめる。履歴の取得漏れやタグの打ち直しに
      # 気づかないまま公開すると、以後どの端末にも更新が降りなくなる。
      - name: Verify version code increases
        if: github.ref_type == 'tag'
        env:
          VERSION_CODE: ${{ steps.compute.outputs.code }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/${REPOSITORY}/releases/download/latest/latest.json"
          published=$(curl -fsSL "$url" | jq -r '.android.versionCode') || {
            echo "::warning::配布中の latest.json を取得できませんでした。版の比較を省きます"
            exit 0
          }
          if [ "$VERSION_CODE" -le "$published" ]; then
            echo "versionCode が増えていません（配布中 $published → 今回 $VERSION_CODE）" >&2
            exit 1
          fi
          echo "versionCode: $published → $VERSION_CODE"

  # 配布物を作る前にテストとカバレッジ検証を通す。ここが落ちればリリースまで進まない。
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # リポジトリに置いている gradle-wrapper.jar が公式のものであることを確かめる。
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # check は androidMain のコンパイルを含まないため、対象を明示して補う。
      - name: Run tests
        run: >
          ./gradlew check :shared:compileAndroidMain :androidApp:compileDebugKotlin
          --console=plain

  # MSI の版数は major.minor.patch しか受け付けないため、タグを打ったときだけ組む。
  desktop:
    if: github.ref_type == 'tag'
    needs: [version, check]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # jpackage の MSI 生成は WiX 3 の candle/light を PATH から探す（WiX 4 以降は使えない）。
      # ランナーに入っている版を使い、無いときだけ WIX_VERSION の版を入れる。
      - name: Ensure WiX 3 on PATH
        run: |
          $programFiles = ${env:ProgramFiles(x86)}
          $findWix = { Get-ChildItem $programFiles -Directory -Filter "WiX Toolset v3.*" -ErrorAction SilentlyContinue |
            Sort-Object Name | Select-Object -Last 1 }
          $wix = & $findWix
          if (-not $wix) {
            choco install wixtoolset "--version=$env:WIX_VERSION" --require-checksums --no-progress -y
            $wix = & $findWix
          }
          if (-not $wix) { throw "WiX 3 が見つかりません" }
          Write-Host "WiX toolset: $($wix.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $wix.FullName "bin")

      - name: Build MSI
        run: >
          ./gradlew :desktopApp:packageMsi
          "-Pperanta.versionCode=${{ needs.version.outputs.code }}"
          "-Pperanta.versionName=${{ needs.version.outputs.name }}"
          --console=plain

      - name: Collect MSI
        run: |
          $msi = Get-ChildItem desktopApp/build/compose/binaries/main/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI が生成されていません" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item $msi.FullName artifacts/peranta.msi

      # MSI はタグを打ったときだけ組み、必ずリリースへ載る。成果物として要るのは release ジョブへ
      # 渡すまでなので、保持期間を最短にする。Actions のストレージ枠はアカウント全体で共有していて、
      # 既定の 90 日で抱え続けると他のリポジトリの CI まで止まる。
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: artifacts/peranta.msi
          if-no-files-found: error
          retention-days: 1

  # 手動実行でも組む。配布はしないが、実機で試すための署名済み APK を成果物として残す。
  android:
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # 署名鍵は secrets から復元する。同じ鍵で署名し続ける限り端末上で上書き更新できる。
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 が未設定です" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          PERANTA_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          PERANTA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PERANTA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PERANTA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :androidApp:assembleRelease
          "-Pperanta.versionCode=${{ needs.version.outputs.code }}"
          "-Pperanta.versionName=${{ needs.version.outputs.name }}"
          --console=plain

      # 署名鍵が効かないと APK は -unsigned の名前で出る。未署名のまま配ると端末で
      # 上書き更新できないので、署名済みだけを拾って見つからなければ落とす。
      - name: Collect APK
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "署名済みの APK が生成されていません" >&2
            exit 1
          fi
          mkdir -p artifacts
          cp "$apk" artifacts/peranta.apk

      # タグを打ったときの APK はリリースへ載るため、保持期間は release ジョブへ渡すまででよい。
      # 手動実行の APK は成果物としてしか残らないため、実機へ入れるまでの猶予を置く。
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/peranta.apk
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 1 || 3 }}

  # 配布物の照合値からマニフェストを組み、署名する。公開の権限は持たず、成果物として release へ渡す。
  # 署名鍵を持つのはこのジョブだけで、リリースを書き換える権限とは同居させない。
  manifest:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # アプリが引く latest.json。url は配布済みの旧版が取得先として読むため載せ続ける。
      - name: Write latest.json
        env:
          VERSION_CODE: ${{ needs.version.outputs.code }}
          VERSION_NAME: ${{ needs.version.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          base="https://github.com/${REPOSITORY}/releases/download/latest"
          apk_sha=$(sha256sum artifacts/peranta.apk | cut -d' ' -f1)
          msi_sha=$(sha256sum artifacts/peranta.msi | cut -d' ' -f1)
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$base/peranta.apk" --arg apkSha "$apk_sha" \
            --arg msiUrl "$base/peranta.msi" --arg msiSha "$msi_sha" \
            '{
              android: { versionCode: $versionCode, versionName: $versionName, url: $apkUrl, sha256: $apkSha },
              desktop: { versionCode: $versionCode, versionName: $versionName, url: $msiUrl, sha256: $msiSha }
            }' > artifacts/latest.json

      # latest.json の生バイトへ署名する。アプリは署名を確かめてからでないとマニフェストを解釈しない。
      # 鍵は環境変数で受け取り、権限を絞った一時ファイルへ書いて使い、ジョブを抜けるときに消す。
      # 引数へ載せるとプロセス一覧から読める。
      - name: Sign latest.json
        env:
          SIGNING_KEY: ${{ secrets.PERANTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "PERANTA_SIGNING_KEY が未設定です" >&2
            exit 1
          fi
          key_file="$RUNNER_TEMP/manifest-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key_file")
          openssl dgst -sha256 -sign "$key_file" artifacts/latest.json |
            base64 -w0 > artifacts/latest.json.sig

          # アプリが持つ公開鍵で確かめてから配る。鍵が食い違ったまま公開すると、
          # 配布済みの全端末が更新できなくなる。
          printf '%s' "$MANIFEST_PUBLIC_KEY" | base64 -d > "$RUNNER_TEMP/manifest-public-key.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/manifest-public-key.der" \
            -out "$RUNNER_TEMP/manifest-public-key.pem"
          base64 -d artifacts/latest.json.sig > "$RUNNER_TEMP/latest.json.sig.der"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/manifest-public-key.pem" \
            -signature "$RUNNER_TEMP/latest.json.sig.der" artifacts/latest.json

      # マニフェストもリリースへ載るため、保持期間は release ジョブへ渡すまででよい。
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: |
            artifacts/latest.json
            artifacts/latest.json.sig
          if-no-files-found: error
          retention-days: 1

  # 成果物を公開するだけのジョブ。contents: write を持つのはここだけ。
  release:
    needs: [version, desktop, android, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 版ごとのリリース。配布物の実物が残るので、後からどの版で何を配ったかを辿れる。
      # 配布物を書き込む唯一の外部コードなので、可変タグではなくコミットで固定する。
      - name: Publish versioned release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ needs.version.outputs.name }}
          body: |
            Peranta ${{ needs.version.outputs.name }}

            配布中の版として `latest` にも同じ配布物を置いている。
            アプリの設定画面「アプリの更新」から確認・適用できる。
          files: |
            artifacts/peranta.msi
            artifacts/peranta.apk

      # 更新経路。配布済みのアプリは latest からマニフェストと配布物を引くため、
      # 置き場を動かさずに中身だけ差し替える。
      - name: Update latest release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            配布中の版（${{ needs.version.outputs.name }}）。
            アプリの設定画面「アプリの更新」から確認・適用できる。
          prerelease: true
          files: |
            artifacts/peranta.msi
            artifacts/peranta.apk
            artifacts/latest.json
            artifacts/latest.json.sig
