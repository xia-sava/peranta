name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 既定では GITHUB_TOKEN に何の権限も与えない。必要なジョブが必要な分だけ宣言する。
permissions: {}

# 同じ参照への連続 push では最新のものだけ検証する。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "23"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # リポジトリに置いている gradle-wrapper.jar が公式のものであることを確かめる。
      - uses: gradle/actions/wrapper-validation@v6

      # キャッシュ機能は MIT ライセンスの外にあり、利用規約への同意を要する。
      - uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      # check は androidMain のコンパイルを含まないため、対象を明示して補う。
      - name: Run tests
        run: >
          ./gradlew check :shared:compileAndroidMain :androidApp:compileDebugKotlin
          --console=plain
